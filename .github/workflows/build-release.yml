# Builds the Windows installer from the tagged source on a GitHub-hosted runner, attests its provenance,
# and publishes the GitHub Release with the installer, SHA256SUMS.txt and the Persian guide.
# Trigger: push a tag v<version> that matches package.json "version" (e.g. v1.3.0).
name: build-release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write      # create the release and upload assets
  id-token: write      # sign the provenance attestation
  attestations: write  # store the attestation

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Check that the tag matches package.json
        shell: pwsh
        run: |
          $pkg = (Get-Content package.json -Raw | ConvertFrom-Json).version
          $tag = "${{ github.ref_name }}".TrimStart("v")
          if ($pkg -ne $tag) { Write-Error "tag $tag does not match package.json version $pkg"; exit 1 }
          "version $pkg" | Out-Host

      - name: Install
        run: npm ci

      - name: Test
        run: npm test

      - name: Build installer (unsigned)
        run: npm run dist
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"

      - name: Checksums
        shell: pwsh
        run: |
          $lines = Get-ChildItem dist\*.exe | ForEach-Object { "{0} *{1}" -f (Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLower(), $_.Name }
          # LF line endings, so `sha256sum -c SHA256SUMS.txt` also works on Linux/macOS
          [IO.File]::WriteAllText("$PWD\dist\SHA256SUMS.txt", (($lines -join "`n") + "`n"))
          Get-Content dist\SHA256SUMS.txt

      - name: Verify local release assets
        shell: pwsh
        run: ./scripts/verify-release-checksums.ps1 -Directory dist

      - name: Attest build provenance (public repositories only; GitHub offers no attestations for private ones)
        if: ${{ !github.event.repository.private }}
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: dist/*.exe

      - name: Release notes
        shell: pwsh
        run: |
          $v = "${{ github.ref_name }}".TrimStart("v")
          $notes = "docs/releases/RELEASE_NOTES_$v.md"
          if (-not (Test-Path $notes)) { $notes = "docs/releases/RELEASE_TEMPLATE.md" }
          Copy-Item $notes dist\NOTES.md
          Copy-Item docs\README-FA.md dist\README-FA.md

      - name: Create draft GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = "${{ github.ref_name }}"
          $files = @((Get-ChildItem dist\*.exe).FullName) + "dist\SHA256SUMS.txt" + "dist\README-FA.md"
          gh release create $tag --repo "${{ github.repository }}" --title "Sahne ProMax $($tag.TrimStart('v'))" --notes-file dist\NOTES.md --verify-tag --draft @files

      # A release created with GITHUB_TOKEN does not trigger release:published workflows.
      # Verify the uploaded draft assets in this same job before publishing.
      - name: Verify uploaded release assets
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $downloadDir = Join-Path $env:RUNNER_TEMP 'published-release-assets'
          New-Item -ItemType Directory -Force -Path $downloadDir | Out-Null
          gh release download "${{ github.ref_name }}" --repo "${{ github.repository }}" --pattern '*.exe' --pattern 'SHA256SUMS.txt' --dir $downloadDir
          ./scripts/verify-release-checksums.ps1 -Directory $downloadDir

      - name: Publish verified GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release edit "${{ github.ref_name }}" --repo "${{ github.repository }}" --draft=false --latest

      - name: Delete the draft release after a failed run
        if: failure()
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $isDraft = gh release view "${{ github.ref_name }}" --repo "${{ github.repository }}" --json isDraft -q .isDraft 2>$null
          if ($isDraft -eq 'true') {
            gh release delete "${{ github.ref_name }}" --repo "${{ github.repository }}" --yes --cleanup-tag=false --verbose
          } else {
            Write-Host "release is not a draft (or does not exist); leaving it in place"
          }
