# Verifies (and, if missing, generates) SHA-256 checksums for the assets of a published release.
# It does NOT build ProMax. It requires the uploaded checksum manifest to cover exactly all installer/archive assets.
name: release-checksums

on:
  release:
    types: [published]

permissions:
  contents: write   # needed only to upload SHA256SUMS.txt when it is missing

jobs:
  checksums:
    runs-on: ubuntu-latest
    steps:
      - name: Download release assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p assets && cd assets
          gh release download "${{ github.event.release.tag_name }}" --repo "${{ github.repository }}"
          ls -la
      - name: Compute checksums of installer / zip
        working-directory: assets
        run: |
          set -euo pipefail
          shopt -s nullglob
          files=( *.exe *.zip )
          if [ ${#files[@]} -eq 0 ]; then
            echo "No installer or archive assets found" >&2
            exit 1
          fi
          sha256sum --binary "${files[@]}" | tee ../SHA256SUMS.computed.txt
      - name: Compare with uploaded SHA256SUMS.txt (fail on mismatch or missing entries)
        working-directory: assets
        run: |
          set -euo pipefail
          if [ -f SHA256SUMS.txt ]; then
            if ! cmp -s <(LC_ALL=C sort SHA256SUMS.txt) <(LC_ALL=C sort ../SHA256SUMS.computed.txt); then
              echo "SHA256SUMS.txt does not exactly cover the downloaded installer/archive assets" >&2
              diff -u <(LC_ALL=C sort SHA256SUMS.txt) <(LC_ALL=C sort ../SHA256SUMS.computed.txt) || true
              exit 1
            fi
            sha256sum -c SHA256SUMS.txt
            echo "uploaded SHA256SUMS.txt exactly matches the installer/archive assets"
          else
            echo "SHA256SUMS.txt missing — uploading the computed one"
            cp ../SHA256SUMS.computed.txt SHA256SUMS.txt
            gh release upload "${{ github.event.release.tag_name }}" SHA256SUMS.txt --repo "${{ github.repository }}"
          fi
        env:
          GH_TOKEN: ${{ github.token }}
